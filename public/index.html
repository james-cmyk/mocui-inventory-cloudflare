<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-title" content="漠翠进销存" />
  <title>漠翠进销存</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <style id="bootCritical">
    html,body{background:#f5f6f8}
    .boot-screen{position:fixed;z-index:9998;inset:0;padding:calc(22px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));background:#f5f6f8;color:#101828;opacity:1;transition:opacity .2s ease;overflow:hidden}
    .boot-screen.is-ready{opacity:0;pointer-events:none}
    .boot-shell{max-width:620px;margin:0 auto}.boot-brand{font-size:22px;font-weight:850;letter-spacing:.2px}.boot-status{font-size:12px;color:#667085;margin-top:4px;min-height:18px}
    .boot-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}.boot-card{height:88px;border:1px solid #e4e7ec;border-radius:16px;background:#fff;box-shadow:0 7px 24px rgba(16,24,40,.05);padding:14px}
    .boot-line{height:11px;border-radius:999px;background:linear-gradient(90deg,#eef1f4 25%,#fafbfc 45%,#eef1f4 65%);background-size:220% 100%;animation:bootShimmer 1.25s infinite}.boot-line.short{width:46%}.boot-line.value{height:22px;width:66%;margin-top:13px}
    .boot-list{margin-top:14px}.boot-row{height:74px;border:1px solid #e4e7ec;border-radius:15px;background:#fff;margin-top:9px;padding:14px}.boot-row .boot-line:first-child{width:52%}.boot-row .boot-line:last-child{width:78%;margin-top:12px}
    .boot-retry{display:none;margin-top:18px;border:0;border-radius:12px;padding:12px 16px;background:#101828;color:#fff;font-weight:750}.boot-screen.has-error .boot-retry{display:inline-block}
    @keyframes bootShimmer{0%{background-position:100% 0}100%{background-position:-120% 0}}
    @media(prefers-reduced-motion:reduce){.boot-screen{transition:none}.boot-line{animation:none}}
  </style>
  <link rel="stylesheet" href="app.css" />
</head>
<body>

  <div id="bootScreen" class="boot-screen" role="status" aria-live="polite">
    <div class="boot-shell">
      <div class="boot-brand">漠翠进销存</div>
      <div id="bootStatus" class="boot-status">正在安全启动…</div>
      <div class="boot-metrics">
        <div class="boot-card"><div class="boot-line short"></div><div class="boot-line value"></div></div>
        <div class="boot-card"><div class="boot-line short"></div><div class="boot-line value"></div></div>
        <div class="boot-card"><div class="boot-line short"></div><div class="boot-line value"></div></div>
        <div class="boot-card"><div class="boot-line short"></div><div class="boot-line value"></div></div>
      </div>
      <div class="boot-list">
        <div class="boot-row"><div class="boot-line"></div><div class="boot-line"></div></div>
        <div class="boot-row"><div class="boot-line"></div><div class="boot-line"></div></div>
      </div>
      <button id="bootRetry" class="boot-retry" type="button">重新连接</button>
    </div>
  </div>

  <div id="app">
    <header class="topbar">
      <div class="top-title-group">
        <button id="pageBack" class="page-back hidden" type="button" aria-label="返回上一页">←</button>
        <div>
          <div class="brand">漠翠进销存</div>
          <div id="pageSubtitle" class="subtitle">云端同步版</div>
        </div>
      </div>
      <div class="top-actions"><span id="cloudBadge" class="cloud-badge checking">连接中</span><button id="topAction" class="icon-btn hidden" type="button" aria-label="页面操作">＋</button></div>
    </header>

    <main id="main" class="main"></main>

    <nav class="bottom-nav" aria-label="主导航">
      <button data-route="dashboard" class="nav-item active"><span>⌂</span><b>概况</b></button>
      <button data-route="products" class="nav-item"><span>◫</span><b>商品</b></button>
      <button data-route="loans" class="nav-item"><span>⇄</span><b>调借</b></button>
      <button data-route="reports" class="nav-item"><span>▥</span><b>报表</b></button>
      <button data-route="more" class="nav-item"><span>•••</span><b>更多</b></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="pwa.js"></script>
  <script src="cloud.js"></script>
  <script src="qinsilk-import.js"></script>
  <script src="content-workbench.js"></script>
  <script src="app.js"></script>
</body>
</html>
