<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>漠翠进销存 · 安全修复</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f7f8f8;color:#18231f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:520px;margin:auto;padding:56px 18px}h1{font-size:24px;margin:0 0 12px}p{font-size:14px;color:#64716a;line-height:1.75}.card{padding:20px;background:#fff;border:1px solid #e2e7e5;border-radius:18px;margin-top:24px}.note{font-size:13px;background:#f2f7f4;padding:12px;border-radius:11px;line-height:1.65;color:#466051}button,a.action{width:100%;display:block;margin-top:13px;text-align:center;border:none;padding:15px;border-radius:13px;font-weight:700;font-size:15px;text-decoration:none}button{background:#15211b;color:#fff}button:disabled{opacity:.6}a.action{background:#f1f3f2;color:#15211b}pre{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7;color:#3a4e43}small{font-size:12px;line-height:1.7;display:block;color:#87958d}
</style></head><body><main><h1>漠翠进销存 · 安全诊断</h1><p>用于处理“数据库指定的数据表不存在”的启动失败。请在发生故障的**同一个浏览器/主屏幕应用环境**中使用。</p><section class="card"><div class="note"><strong>不清空、不重置、不删除数据。</strong>仅补建缺失的数据库表和索引，不会修改商品、销售、借调、库存或云端记录。</div><pre id="status" role="status" aria-live="polite">尚未开始检查。</pre><button id="start" type="button">检查并修复本机数据库</button><button class="action" id="home" type="button" hidden>检查通过 · 切换新版并打开 ERP</button><small>如提示被其他页面阻塞，请关闭其他 ERP 标签页后再试。Safari 和主屏幕应用可能使用不同的本机存储空间。</small></section></main>
<script src="db-schema-guard-v4.7.9.4.js?v=4.7.9.4"></script>
<script>
'use strict';(()=>{const btn=document.getElementById('start'),label=document.getElementById('status'),home=document.getElementById('home');btn.onclick=async()=>{btn.disabled=true;home.hidden=true;label.textContent='正在检查正式业务数据库与同步数据库…';try{const results=await window.MocuiSchemaGuard4794.check();label.textContent=results.map(x=>`${x.name}：版本 ${x.version}，${x.modified?'已补建 '+(x.added||[]).join('、'):'结构完整，无须变动'}`).join('\n')+'\n所有检查已完成。本机业务数据和待同步记录未被清空。';home.hidden=false;}catch(e){label.textContent='修复尚未完成：'+(e?.message||String(e))+'\n请不要删除本机数据。';}finally{btn.disabled=false;}};
  home.onclick=async()=>{
    home.disabled=true;label.textContent+='\n正在检查应用离线缓存并切换新版，已有本机数据不会被清除…';
    try{
      if('serviceWorker' in navigator){
        let registration=await navigator.serviceWorker.getRegistration('./');
        if(!registration)registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
        else await registration.update();
        const worker=registration.waiting||registration.installing;
        if(worker&&worker.state!=='installed')await new Promise((resolve,reject)=>{
          let done=false;
          const timer=setTimeout(()=>{if(!done){done=true;reject(new Error('新版缓存下载超时'))}},65000);
          const listener=()=>{if(done)return;
            if(worker.state==='installed'){done=true;clearTimeout(timer);resolve()}
            else if(worker.state==='redundant'){done=true;clearTimeout(timer);reject(new Error('新版缓存未能安装'))}
          };
          worker.addEventListener('statechange',listener);listener();
        });
        if(registration.waiting){
          registration.waiting.postMessage({type:'SKIP_WAITING_MANUAL'});
          await new Promise(resolve=>{let completed=false;const done=()=>{if(completed)return;completed=true;resolve()};navigator.serviceWorker.addEventListener('controllerchange',done,{once:true});setTimeout(done,3500)});
        }
      }
      location.replace('./?db_repaired=4794');
    }catch(error){
      label.textContent+='\n切换缓存未完成：'+(error?.message||String(error))+'。\n可以点“返回 ERP”使用带版本参数的新页面，绝不要清空本机数据。';
      home.textContent='跳过缓存切换，打开新版 ERP';
      home.onclick=()=>location.replace('./?db_repaired=4794');
      home.disabled=false;
    }
  };
})();
</script></body></html>
