<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>漠翠商品素材</title>
  <link rel="stylesheet" href="share.css">
</head>
<body>
  <main class="share-shell">
    <header class="share-head"><div><div class="eyebrow">漠翠珠宝 · 商品素材</div><h1 id="shareTitle">正在打开…</h1><div id="shareMeta" class="share-meta"></div></div><div class="share-mark">漠翠</div></header>
    <div id="shareState" class="state-card">正在安全读取分享内容…</div>
    <section id="shareContent" class="hidden">
      <div id="priceCard" class="price-card hidden"></div>
      <div class="section-title">转发文案</div>
      <div class="copy-card"><div id="copyText" class="copy-text"></div><button id="copyBtn" class="primary-btn">复制文案</button></div>
      <div class="section-title">原图 / 原视频 <small>保持原始构图，不裁切</small></div>
      <div id="mediaGrid" class="media-grid"></div>
      <div id="bulkActions" class="bulk-actions"></div>
      <div class="privacy-note">此页面仅包含店主主动分享的公开素材。链接过期或被撤销后将无法继续访问。</div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="share.js"></script>
</body>
</html>
